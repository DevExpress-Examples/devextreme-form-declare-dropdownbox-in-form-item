<div class="default-style">
  <dx-form id="form" [formData]="employee" validationGroup="formGroup">
    <dxi-item dataField="owner" [isRequired]="true"> </dxi-item>
    <dxi-item
      dataField="status"
      [isRequired]="true"
      template="statusTemplate"
    ></dxi-item>
    <dxi-item
      itemType="button"
      horizontalAlignment="left"
      [buttonOptions]="{
        text: 'Validate',
        type: 'success',
        onClick: validateClick
      }"
    ></dxi-item>

    <div *dxTemplate="let itemInfo of 'statusTemplate'">
      <dx-drop-down-box
        #ddbox
        [dataSource]="statuses"
        [(value)]="employee.status"
        [showClearButton]="true"
        valueExpr="id"
        displayExpr="name"
      >
        <div *dxTemplate="let data of 'content'">
          <dx-data-grid
            [dataSource]="statuses"
            [height]="250"
            keyExpr="id"
            [selectedRowKeys]="getSelectedRowKeys(employee.status)"
            (onSelectionChanged)="gridSelectionChanged($event, ddbox, itemInfo)"
          >
            <dxo-selection mode="single"></dxo-selection>
          </dx-data-grid>
        </div>
        <dx-validator validationGroup="formGroup">
          <dxi-validation-rule type="required" message="Status is required">
          </dxi-validation-rule>
        </dx-validator>
      </dx-drop-down-box>
    </div>
  </dx-form>
</div>
